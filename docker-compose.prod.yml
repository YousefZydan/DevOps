services:
  backend:
    image: ghcr.io/yousefzydan/devops-backend:latest
    build:
      context: ./Backend
      dockerfile: Dockerfile
  frontend:
    image: ghcr.io/yousefzydan/devops-frontend:latest
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
  proxy:
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

