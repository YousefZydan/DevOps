name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${owner}/devops-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/devops-frontend" >> "$GITHUB_OUTPUT"
      - name: Push backend
        run: |
          docker build -t ${{ steps.meta.outputs.backend }}:${{ github.sha }} -t ${{ steps.meta.outputs.backend }}:latest ./Backend
          docker push ${{ steps.meta.outputs.backend }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.backend }}:latest
      - name: Push frontend
        run: |
          docker build --build-arg VITE_API_BASE_URL= -t ${{ steps.meta.outputs.frontend }}:${{ github.sha }} -t ${{ steps.meta.outputs.frontend }}:latest ./Frontend
          docker push ${{ steps.meta.outputs.frontend }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.frontend }}:latest

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            sleep 20
            curl -fsS "https://${{ secrets.PRODUCTION_DOMAIN }}/health/live"
