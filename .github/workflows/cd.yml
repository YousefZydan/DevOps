name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${owner}/devops-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/devops-frontend" >> "$GITHUB_OUTPUT"
      - name: Push backend
        run: |
          docker build -t ${{ steps.meta.outputs.backend }}:${{ github.sha }} -t ${{ steps.meta.outputs.backend }}:latest ./Backend
          docker push ${{ steps.meta.outputs.backend }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.backend }}:latest
      - name: Push frontend
        run: |
          docker build --build-arg VITE_API_BASE_URL= -t ${{ steps.meta.outputs.frontend }}:${{ github.sha }} -t ${{ steps.meta.outputs.frontend }}:latest ./Frontend
          docker push ${{ steps.meta.outputs.frontend }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.frontend }}:latest
      - name: Make GHCR packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "/user/packages/container/devops-backend/visibility" -f visibility=public
          gh api --method PUT "/user/packages/container/devops-frontend/visibility" -f visibility=public

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io || true
            sleep 20
            curl -fsS "https://${{ secrets.PRODUCTION_DOMAIN }}/health/live"
